spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bunique_jewellery?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: 
    password: 
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080

app:
  upload-dir: uploads
  base-url: http://localhost:8080
  jwt:
    secret: bunique-handmade-jewellery-secret-key-2024-very-long-secure
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:3000
